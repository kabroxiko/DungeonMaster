name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  go:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26 (actions/runner-images#14748), and a
    # build that must reproduce should not change operating system underneath itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Take the language version from go.mod instead of repeating it here, so the toolchain CI installs cannot
          # drift from the one the module declares.
          go-version-file: go/go.mod
          # The module lives in go/, so the build cache has to be keyed on its go.sum; the default (repo root) finds
          # no dependency file and silently restores nothing.
          cache-dependency-path: go/go.sum
      - name: Test and build Go server
        run: |
          cd go
          go test ./...
          go build -o /tmp/gmai-server ./cmd/gmai-server

  docker:
    name: Build production image
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The SPA bakes this into the bundle, so a production image cannot be built without it. PRs build the image as a
      # Dockerfile check and may leave it empty; pushes cannot publish a sign-in-broken image.
      - name: Verify SPA build inputs
        if: github.event_name != 'pull_request'
        env:
          VUE_APP_DM_GOOGLE_CLIENT_ID: ${{ vars.VUE_APP_DM_GOOGLE_CLIENT_ID || secrets.VUE_APP_DM_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VUE_APP_DM_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set the repository variable VUE_APP_DM_GOOGLE_CLIENT_ID (or a secret with the same name) so the SPA can start Google Sign-In."
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dungeonmaster"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VUE_APP_DM_GOOGLE_CLIENT_ID=${{ vars.VUE_APP_DM_GOOGLE_CLIENT_ID || secrets.VUE_APP_DM_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image name
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.tags.outputs.tags }}" > image.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: image-info
          path: image.txt
