name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26 (actions/runner-images#14748), and a
    # build that must reproduce should not change operating system underneath itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Take the language version from go.mod instead of repeating it here, so the toolchain CI installs cannot
          # drift from the one the module declares.
          go-version-file: go/go.mod
          # The module lives in go/, so the build cache has to be keyed on its go.sum; the default (repo root) finds
          # no dependency file and silently restores nothing.
          cache-dependency-path: go/go.sum
      - name: Test and build Go server
        run: |
          cd go
          go test ./...
          go build -o /tmp/gmai-server ./cmd/gmai-server
