worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# The access log records the path only, never the query string: the map image and the event stream carry the session
	# token as ?access_token (an <img> and an EventSource cannot send a header), and an invite token is a path segment of
	# the SPA route, so it is masked too. A token in a log line is a token in every backup it reaches.
	map $uri $loggable_uri {
		default        $uri;
		~^/join-party/ /join-party/<redacted>;
	}

	log_format safe '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
	                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

	access_log /dev/stdout safe;

	client_max_body_size 0;
	sendfile             on;
	keepalive_timeout    65;
	server_tokens        off;

	gzip      on;
	gzip_types text/plain text/css application/json application/javascript image/svg+xml;

	# A rootless nginx writes its temporary files under /tmp; the entrypoint creates and owns this directory.
	client_body_temp_path /tmp/nginx/client_temp;
	proxy_temp_path       /tmp/nginx/proxy_temp;
	fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
	uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
	scgi_temp_path        /tmp/nginx/scgi_temp;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		listen 8080;
		server_name _;

		root  /app/static;
		index index.html;

		# The client uses history routing, so unknown paths belong to the SPA.
		location / {
			try_files $uri $uri/ /index.html;
		}

		# SSE: one request stays open for the life of the tab and must never be buffered.
		location ^~ /api/game-state/events/ {
			proxy_pass http://127.0.0.1:5001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_cache off;
			proxy_read_timeout 86400s;
			proxy_send_timeout 86400s;
		}

		# WebSocket upgrade for the game-state socket.
		location ^~ /api/game-state/ws/ {
			proxy_pass http://127.0.0.1:5001;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}

		# Campaign and character generation are long LLM calls; the server allows up to 900s for them.
		location /api/ {
			proxy_pass http://127.0.0.1:5001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_connect_timeout 60s;
			proxy_send_timeout 900s;
			proxy_read_timeout 900s;
		}
	}
}
